spring:
  application:
    name: repair-flow

  # ---------- 数据源配置 ----------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/repair_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  # ---------- Redis 配置 ----------
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms
      connect-timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # ---------- Jackson 日期格式 ----------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# ---------- MyBatis 配置 ----------
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.repair.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ---------- 日志配置 ----------
logging:
  level:
    com.repair: debug

# ---------- JWT 配置 ----------
jwt:
  secret: repair-flow-secret-key-2024-this-is-256-bit-secret-key
  expiration: 7200000          # 2小时

